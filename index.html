<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Notes</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      min-height: 100vh;
      background: #071a3d;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main {
      width: min(760px, 100%);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .note {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filename {
      font-size: 16px;
      line-height: 1.4;
      color: #fff;
      word-break: break-word;
    }
    audio {
      width: 100%;
      height: 42px;
    }
  </style>
</head>
<body>
  <main>
    <div class="note">
      <div class="filename">Rachaminoff balade op3.m4a</div>
      <audio controls preload="metadata">
        <source src="Rachaminoff balade op3.m4a" type="audio/mp4">
      </audio>
    </div>

    <div class="note">
      <div class="filename">Moonlight Sonata 3rd movement.m4a</div>
      <audio controls preload="metadata">
        <source src="Moonlight Sonata 3rd movement.m4a" type="audio/mp4">
      </audio>
    </div>

    <div class="note">
      <div class="filename">La campanella reqiuem final.m4a</div>
      <audio controls preload="metadata">
        <source src="La campanella reqiuem final.m4a" type="audio/mp4">
      </audio>
    </div>
  </main>
</body>
</html>
